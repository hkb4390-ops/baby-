<nav class="bottom-nav"><button type="button" class="nav-item active"><span>⌂</span>HOME</button><button type="button" class="nav-item" onclick="nav('apks.html')"><span>▣</span>ALL APKS</button><button type="button" class="nav-item" onclick="nav('chat.html')"><span>💬</span>CHAT</button><button type="button" class="nav-item" onclick="nav('profile.html')"><span>●</span>PROFILE</button></nav></div>
<div class="drawer-back" id="drawerBack" onclick="if(event.target===this)closeDrawer()"><aside class="drawer"><div class="drawer-head"><img src="images/logo-96.png" width="44" height="44" alt="HIM APP"><div><h2>HIM APP</h2><small>BY HIMANSHU</small></div></div><div class="drawer-section">Menu</div>
<button class="drawer-link" onclick="closeDrawer()"><i data-icon="home"></i><b>Home</b></button><button class="drawer-link" onclick="nav('apks.html')"><i data-icon="crown"></i><b>ALL APK 👑</b></button><button class="drawer-link" onclick="nav('favourites.html')"><i data-icon="heart"></i><b>Favourite APK</b></button><button class="drawer-link" onclick="nav('profile.html')"><i data-icon="settings"></i><b>Settings</b></button><button class="drawer-link" onclick="nav('chat.html')"><i data-icon="chat"></i><b>Chat (support)</b></button><button class="drawer-link" onclick="nav('profile.html#rate')"><i data-icon="star"></i><b>Rate</b></button><button class="drawer-link" onclick="openShare()"><i data-icon="share"></i><b>Share</b></button>
<div class="drawer-section">Mods</div><button class="drawer-link" onclick="nav('apks.html')"><i data-icon="android"></i><b>Mod APKs</b></button><button class="drawer-link" onclick="nav('apks.html')"><i data-icon="globe"></i><b>Mod Sites</b></button><button class="drawer-link" onclick="openExternal(TELEGRAM_URL)"><i data-icon="plane"></i><b>Telegram</b></button>

<div class="install-banner" id="installBanner"><img src="images/logo-96.png" width="40" height="40" alt=""><div class="grow"><b>Install HIM APP</b><small>Add it to your home screen like an app</small></div><button id="installBtn">Install</button><button class="x" id="installClose">×</button></div><div id="toast"></div>
<script>
document.addEventListener("DOMContentLoaded",function(){
if(!requireApp())return;
document.getElementById("hello").innerHTML=`Hello <b>${esc(getUserName())}</b> 👋<br>Start your preparation here`;
setupInstall();
idle(function(){registerUser().catch(()=>{});watchBlocked()},2000);
(function renderQuickGrid(){
  const T=(href,ic,cls,t,sub,idAttr,ext)=>`<a class="feature" href="${href}"${ext?' target="_blank" rel="noopener"':''}><div class="ico ${cls}">${icon(ic,22)}</div><div class="tx"><b>${t}</b><small${idAttr?` id="${idAttr}"`:""}>${sub}</small></div></a>`;
  document.getElementById("quickGrid").innerHTML=
    T("apks.html","crown","","ALL APK 👑","Browse everything","allCount")+
    T("favourites.html","heart","c2","Favourite APK","Your saved apps","favCount")+
    T("apks.html","android","c3","Mod APK","Apps & games","apkCount")+
    T("apks.html","globe","c4","Mod Site","Useful sites","")+
    T(TELEGRAM_URL,"plane","c5","Telegram","Join the channel","",true)+
    T("chat.html","chat","c2","Support","Chat with admin","");
})();
setTimeout(()=>himJoinPopup(),1400);

/* live counts on the tiles */
function counts(d){
  const n=d.length,f=getFavs().filter(id=>d.some(x=>x.id===id)).length;
  const a=document.getElementById("allCount"),b=document.getElementById("apkCount"),c=document.getElementById("favCount");
  if(a&&n)a.textContent=n+" apps";if(b&&n)b.textContent=n+" apps";if(c)c.textContent=f?f+" saved":"Your saved apps";
}
loadApks(counts).then(counts);syncFavs(()=>loadApks().then(counts));

/* ---- banners (cache first) ---- */
const state={bi:0,timer:null,sig:""};
function renderBanners(arr){
  if(!arr.length)arr=[{image:APP_LOGO,title:"HIM APP"}];
  const sig=JSON.stringify(arr.map(x=>x.image));if(sig===state.sig)return;state.sig=sig;
  clearInterval(state.timer);state.bi=0;
  const track=document.getElementById("bannerTrack"),dots=document.getElementById("bannerDots");
  track.style.transform="";
  track.innerHTML=arr.map((x,i)=>`<div class="banner-slide"><img src="${esc(x.image)}" ${i===0?'fetchpriority="high"':'loading="lazy"'} decoding="async" width="640" height="360" alt="${esc(x.title||"Banner")}" onerror="this.onerror=null;this.src='${APP_LOGO}'"></div>`).join("");
  dots.innerHTML=arr.length>1?arr.map((_,i)=>`<i class="dot ${i===0?"active":""}"></i>`).join(""):"";
  if(arr.length>1){
    const go=i=>{state.bi=(i+arr.length)%arr.length;track.style.transform=`translateX(-${state.bi*100}%)`;[...dots.children].forEach((d,n)=>d.classList.toggle("active",n===state.bi))};
    state.timer=setInterval(()=>{if(!document.hidden)go(state.bi+1)},4000);
    if(!track._sw){track._sw=1;let sx=0;track.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});track.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>35)go(state.bi+(dx<0?1:-1))},{passive:true})}
  }
}
HIMData.banners(d=>renderBanners(d)).then(d=>renderBanners(d)).catch(()=>renderBanners([]));
});
</script>
</body></html>
